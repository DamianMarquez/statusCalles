services:
  database:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-street_status}
      POSTGRES_USER: ${POSTGRES_USER:-street_status}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-street_status}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-street_status} -d ${POSTGRES_DB:-street_status}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
